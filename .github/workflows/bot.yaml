name: Game Summary Bot

on:
  schedule:
    - cron: '*/30 * * * *'  # اجرا هر ۳۰ دقیقه
  workflow_dispatch:        # اجرای دستی

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Highlights Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          RUN_ONCE: "true"
        run: |
          python GameSummary.py   

      - name: Save sent videos history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_videos.json || true
          git commit -m "Update sent videos history [skip ci]" || echo "No changes to commit"
          git push || true